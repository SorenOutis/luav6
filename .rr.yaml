version: '3'

# Octane overrides most settings via CLI flags (see StartRoadRunnerCommand.php).
# Only settings NOT covered by Octane's -o flags take effect here.
# num_workers, max_jobs, exec_ttl, server.command, http.address, static.dir,
# middleware, and logs.* are all overridden by Octane at startup.

http:
  pool:
    supervisor:
      # RoadRunner restarts a worker whose RSS exceeds this many MB.
      max_worker_memory: 128
      # How often the supervisor polls worker stats.
      watch_tick: 5s
